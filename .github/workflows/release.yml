# SPDX-License-Identifier: GPL-3.0-or-later
# Manual full release from Actions > Release > Run workflow, with the version to give the app.
#   1. checks the version (three integers, as webOS requires) and that tag v<version> is new
#   2. runs the whole CI (ci.yml) on this commit with that version; release jobs require the legacy
#      ARMv7 build, offline plugin-load check and both package artifacts
#   3. creates the GitHub release v<version> on this commit with both IPKs, checksums and manifests
# Public releases contain no third-party .cs3 files until redistribution permissions are verified.
# Releases are made from main only. CI does not test network search, playback or the app on a TV.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version, three integers (x.y.z), e.g. 0.2.0
        required: true
        type: string
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version, tag and branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version '$VERSION' must be three integers, e.g. 0.2.0 (webOS requirement)"
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::releases are made from main (this run is on $GITHUB_REF)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "Releasing v$VERSION from $GITHUB_SHA"

  build:
    name: Build and test
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the package
        uses: actions/download-artifact@v4
        with:
          name: org.csweb.tv-ipk
          path: dist

      - name: Check the package
        run: |
          ipk="dist/org.csweb.tv_${VERSION}_arm.ipk"
          test -f "$ipk" || { ls -l dist; echo "::error::$ipk not built"; exit 1; }
          (cd dist && sha256sum "$(basename "$ipk")" > SHA256SUMS && cat SHA256SUMS)

      # The manifest the Homebrew Channel reads (format of webosbrew-gen-manifest); a listing points at
      # .../releases/latest/download/org.csweb.tv.manifest.json, so full releases are marked latest.
      - name: Homebrew Channel manifest
        run: |
          python3 - "$VERSION" <<'EOF'
          import hashlib, json, os, sys
          version = sys.argv[1]
          ipk = f"org.csweb.tv_{version}_arm.ipk"
          repo, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          manifest = {
              "id": "org.csweb.tv",
              "version": version,
              "type": "native",
              "title": "CSWeb TV",
              "appDescription": "Runs CloudStream extensions natively on the TV. Ships no content or plugins.",
              "iconUri": f"https://raw.githubusercontent.com/{repo}/{sha}/apps/csweb-tv/packaging/icons/largeIcon.png",
              "sourceUrl": f"https://github.com/{repo}",
              "rootRequired": False,
              "ipkUrl": ipk,
              "ipkHash": {"sha256": hashlib.sha256(open(f"dist/{ipk}", "rb").read()).hexdigest()},
          }
          with open("dist/org.csweb.tv.manifest.json", "w") as f:
              json.dump(manifest, f)
          print(json.dumps(manifest, indent=1))
          EOF

      # The release must contain the INNO-Hit IPK built and checked by this same CI run. Do not
      # silently publish an older/main-only release when the experimental 32-bit package is missing.
      - name: Get this run's INNO-Hit 55 package
        uses: actions/download-artifact@v4
        with:
          name: innohit-55-webos-hub-ipk
          path: dist-legacy

      - name: Verify the INNO-Hit IPK and write its manifest
        run: |
          mapfile -t ipks < <(find dist-legacy -maxdepth 1 -type f -name '*.ipk' -print)
          if [[ "${#ipks[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one INNO-Hit IPK from this release build, found ${#ipks[@]}"
            find dist-legacy -maxdepth 2 -type f -print
            exit 1
          fi
          ipk="${ipks[0]}"
          expected="org.csweb.tv.legacy_${VERSION}_arm.ipk"
          if [[ "$(basename "$ipk")" != "$expected" ]]; then
            echo "::error::expected $expected, got $(basename "$ipk")"
            exit 1
          fi
          test -s runtime/licenses-armv7/packages.tsv || {
            echo "::error::missing armv7 runtime license inventory; refusing to publish the IPK"
            exit 1
          }
          (cd dist-legacy && sha256sum "$expected" > SHA256SUMS-legacy)
          python3 - "$VERSION" <<'EOF'
          import hashlib, json, os, sys
          version = sys.argv[1]
          ipk = f"org.csweb.tv.legacy_{version}_arm.ipk"
          repo, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          with open(f"dist-legacy/{ipk}", "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          manifest = {
              "id": "org.csweb.tv.legacy",
              "version": version,
              "type": "native",
              "title": "CloudStream Hub - INNO-Hit 55",
              "appDescription": "Experimental native webOS build for INNO-Hit IH55UWB (IH55UWB4 not tested). "
                                "No third-party repositories, plugins or content are preinstalled.",
              "iconUri": f"https://raw.githubusercontent.com/{repo}/{sha}/apps/csweb-tv/packaging/icons/largeIcon.png",
              "sourceUrl": f"https://github.com/{repo}",
              "rootRequired": False,
              "ipkUrl": ipk,
              "ipkHash": {"sha256": digest},
          }
          with open("dist-legacy/org.csweb.tv.legacy.manifest.json", "w") as f:
              json.dump(manifest, f)
          print(json.dumps(manifest, indent=1))
          EOF

      - name: Release notes
        run: |
          kit=$(tools/fetch-kit.sh --print)
          inputs=$(sed -n 's#^\# mirror: .*/download/##p' runtime/inputs.lock)
          sha=$(cut -d' ' -f1 dist/SHA256SUMS)
          cat > notes.md <<EOF
          CSWeb TV $VERSION for LG webOS TVs (ARM), built by CI from commit \`$GITHUB_SHA\`.

          **Install:** \`org.csweb.tv_${VERSION}_arm.ipk\` with Developer Mode (\`ares-install\`) or the kit's \`tools/install.sh\`.
          SHA-256: \`$sha\`

          The app ships no plugins and no content: it runs CloudStream extensions from repositories you add.

          **Built with**
          - Native App Kit \`$kit\`
          - Plugin runtime from the pinned inputs in \`runtime/inputs.lock\` (release [$inputs](https://github.com/$GITHUB_REPOSITORY/releases/tag/$inputs), which also holds the sources of what the runtime ships)
          - CloudStream pre-release \`eb962b4\`

          **Checked by CI:** host tests (debug and ASan), the plugin runtime build and its licence notices, and the kit's package check. It is not run on a TV by CI.

          **Licences:** GPL-3.0-or-later. The package carries \`licenses/\` (app and kit) and \`runtime-aarch64/licenses/\` (runtime). Source: this repository at this tag, and the release above for the runtime's parts.
          EOF
          legacy_sha=$(cut -d' ' -f1 dist-legacy/SHA256SUMS-legacy)
          {
            echo
            echo "**INNO-Hit 55 package built in this release run:** \`org.csweb.tv.legacy_${VERSION}_arm.ipk\`, SHA-256 \`$legacy_sha\`."
            echo "Targets IH55UWB; IH55UWB4 and all TV behavior remain unverified. The package passed CI checks but has not been tested on an INNO-Hit TV."
            echo "It uses an armv7 plugin runtime and bundled libcurl. No third-party plugins are included in public releases because their redistribution terms are not verified."
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then flags=(--prerelease --latest=false); fi
          gh release create "v$VERSION" "${flags[@]}" \
            --target "$GITHUB_SHA" \
            --title "CSWeb TV $VERSION" \
            --notes-file notes.md \
            "dist/org.csweb.tv_${VERSION}_arm.ipk" dist/org.csweb.tv.manifest.json dist/SHA256SUMS \
            "dist-legacy/org.csweb.tv.legacy_${VERSION}_arm.ipk" \
            dist-legacy/org.csweb.tv.legacy.manifest.json dist-legacy/SHA256SUMS-legacy
