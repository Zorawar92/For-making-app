# SPDX-License-Identifier: GPL-3.0-or-later
# Publish the packages produced by the successful main-branch CI run that explicitly requested a release.
# The artifact is selected by this workflow_run event's run ID; no commit-message run IDs/tags or stale
# artifacts are accepted. Public plugin redistribution is intentionally disabled until licences are verified.
name: Release latest INNO-Hit IPK

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-innohit-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish this CI run's IPKs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[release-innohit]')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify source run and release request
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" "$RUN_ID" "$SOURCE_SHA" <<'PY'
          import json, sys
          data_path, run_id, source_sha = sys.argv[1:]
          run = json.load(open(data_path))
          assert str(run["id"]) == run_id
          assert run["name"] == "CI", run.get("name")
          assert run["event"] == "push", run["event"]
          assert run["head_branch"] == "main", run["head_branch"]
          assert run["head_sha"] == source_sha, (run["head_sha"], source_sha)
          assert run["conclusion"] == "success", run["conclusion"]
          message = run.get("head_commit", {}).get("message", "")
          assert "[release-innohit]" in message, "missing explicit release marker"
          assert "[build-innohit]" in message, "release marker must request a fresh legacy package build"
          assert "[build-innohit-plugins]" not in message, (
              "public release blocked: plugin bundle requested without verified redistribution terms"
          )
          print(f"Verified successful CI run {run_id} for {source_sha}; no plugin bundle requested.")
          PY

      - name: Download IPKs from this exact CI run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: innohit-55-webos-hub-ipk
          path: dist-legacy

      - name: Download the matching main package
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: org.csweb.tv-ipk
          path: dist

      - name: Verify package versions and create checksums
        id: package
        run: |
          mapfile -t legacy_ipks < <(find dist-legacy -maxdepth 1 -type f -name '*.ipk' -print)
          mapfile -t main_ipks < <(find dist -maxdepth 1 -type f -name '*.ipk' -print)
          if [[ "${#legacy_ipks[@]}" -ne 1 || "${#main_ipks[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one main and one INNO-Hit IPK from CI run $RUN_ID"
            find dist dist-legacy -maxdepth 2 -type f -print
            exit 1
          fi
          legacy="$(basename "${legacy_ipks[0]}")"
          main="$(basename "${main_ipks[0]}")"
          if [[ "$legacy" =~ ^org\.csweb\.tv\.legacy_([0-9]+\.[0-9]+\.[0-9]+)_arm\.ipk$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::unexpected INNO-Hit IPK name: $legacy"
            exit 1
          fi
          [[ "$main" == "org.csweb.tv_${version}_arm.ipk" ]] || {
            echo "::error::package versions do not match: $main vs $legacy"
            exit 1
          }
          test -s runtime/licenses-armv7/packages.tsv
          (cd dist && sha256sum "$main" > SHA256SUMS)
          (cd dist-legacy && sha256sum "$legacy" > SHA256SUMS-legacy)
          python3 - "$version" "$main" "$legacy" <<'PY'
          import hashlib, json, os, pathlib, sys
          version, main, legacy = sys.argv[1:]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SOURCE_SHA"]
          def digest(path):
              return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          def manifest(app_id, title, description, filename, path):
              return {
                  "id": app_id,
                  "version": version,
                  "type": "native",
                  "title": title,
                  "appDescription": description,
                  "iconUri": f"https://raw.githubusercontent.com/{repo}/{sha}/apps/csweb-tv/packaging/icons/largeIcon.png",
                  "sourceUrl": f"https://github.com/{repo}",
                  "rootRequired": False,
                  "ipkUrl": filename,
                  "ipkHash": {"sha256": digest(path)},
              }
          manifests = [
              ("dist/org.csweb.tv.manifest.json", manifest(
                  "org.csweb.tv", "CSWeb TV",
                  "Runs CloudStream extensions natively on the TV. Ships no content or plugins.",
                  main, f"dist/{main}")),
              ("dist-legacy/org.csweb.tv.legacy.manifest.json", manifest(
                  "org.csweb.tv.legacy", "CloudStream Hub - INNO-Hit 55",
                  "Experimental native webOS build for INNO-Hit IH55UWB (IH55UWB4 not tested). "
                  "No third-party repositories, plugins or content are preinstalled.",
                  legacy, f"dist-legacy/{legacy}")),
          ]
          for filename, data in manifests:
              pathlib.Path(filename).write_text(json.dumps(data, indent=1) + "\n")
              print(filename, json.dumps(data, indent=1))
          pathlib.Path("version.txt").write_text(version + "\n")
          PY
          version=$(cat version.txt)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists; refusing to overwrite it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          main_sha=$(cut -d' ' -f1 dist/SHA256SUMS)
          legacy_sha=$(cut -d' ' -f1 dist-legacy/SHA256SUMS-legacy)
          cat > notes.md <<EOF
          CloudStream Hub $VERSION packages built and checked by CI from commit \`$SOURCE_SHA\` (run [#$RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID)).

          **INNO-Hit IH55UWB:** \`org.csweb.tv.legacy_${VERSION}_arm.ipk\` SHA-256: $legacy_sha

          **Generic ARM:** \`org.csweb.tv_${VERSION}_arm.ipk\` SHA-256: $main_sha

          The INNO-Hit package is an experimental native webOS build. IH55UWB4 and device behavior are not verified by CI. CI tests are offline and do not establish provider search, network access, playback, or TV compatibility.

          No third-party \`.cs3\` plugins are included: their redistribution permissions have not been verified. This release uses the IPKs from the exact successful CI run linked above, not an older artifact.
          EOF

      - name: Create pre-release with the exact CI artifacts
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "v$VERSION" --prerelease --latest=false \
            --target "$SOURCE_SHA" \
            --title "CloudStream Hub $VERSION (candidate)" \
            --notes-file notes.md \
            "dist/org.csweb.tv_${VERSION}_arm.ipk" \
            dist/org.csweb.tv.manifest.json dist/SHA256SUMS \
            "dist-legacy/org.csweb.tv.legacy_${VERSION}_arm.ipk" \
            dist-legacy/org.csweb.tv.legacy.manifest.json dist-legacy/SHA256SUMS-legacy
