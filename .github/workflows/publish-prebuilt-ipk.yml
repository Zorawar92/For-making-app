# SPDX-License-Identifier: GPL-3.0-or-later
# Publish the INNO-Hit IPK produced by the successful main-branch CI run that explicitly requested a release.
# The artifact is selected by this workflow_run event's run ID; no commit-message run IDs/tags or stale
# artifacts are accepted.
#
# Redistribution note: doGior does not declare a licence for its .cs3 plugins, so public releases ship
# without them by default. The owner has approved bundling StreamingCommunity (and the other pinned
# doGior plugins) into the personal/experimental INNO-Hit IPK built here, for the device owner's own
# use only. Such a build is published as a pre-release and is never marked "latest".
name: Release latest INNO-Hit IPK

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-innohit-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish this CI run's INNO-Hit IPK
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[release-innohit]')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify source run and release request
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" "$RUN_ID" "$SOURCE_SHA" <<'PY'
          import json, sys
          data_path, run_id, source_sha = sys.argv[1:]
          with open(data_path) as source:
              run = json.load(source)
          assert str(run["id"]) == run_id
          assert run["name"] == "CI", run.get("name")
          assert run["event"] == "push", run["event"]
          assert run["head_branch"] == "main", run["head_branch"]
          assert run["head_sha"] == source_sha, (run["head_sha"], source_sha)
          assert run["conclusion"] == "success", run["conclusion"]
          message = run.get("head_commit", {}).get("message", "")
          assert "[release-innohit]" in message, "missing explicit release marker"
          assert "[build-innohit]" in message, "release marker must request a fresh legacy package build"
          # The owner has approved bundling the pinned doGior plugins (StreamingCommunity and others)
          # into this personal/experimental INNO-Hit IPK. See the file header for the redistribution note.
          bundled = "[build-innohit-plugins]" in message
          print(f"Verified successful CI run {run_id} for {source_sha}; plugin bundle requested: {bundled}")
          PY

      - name: Download the INNO-Hit package from this exact CI run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: innohit-55-webos-hub-ipk
          path: dist-legacy

      - name: Verify package version and create checksum and manifest
        id: package
        run: |
          mapfile -t ipks < <(find dist-legacy -maxdepth 1 -type f -name '*.ipk' -print)
          if [[ "${#ipks[@]}" -ne 1 ]]; then
            echo "::error::expected exactly one INNO-Hit IPK from CI run $RUN_ID"
            find dist-legacy -maxdepth 2 -type f -print
            exit 1
          fi
          ipk="$(basename "${ipks[0]}")"
          if [[ "$ipk" =~ ^org\.csweb\.tv\.legacy_([0-9]+\.[0-9]+\.[0-9]+)_arm\.ipk$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::unexpected INNO-Hit IPK name: $ipk"
            exit 1
          fi
          test -s runtime/licenses-armv7/packages.tsv || {
            echo "::error::missing armv7 runtime license inventory; refusing to publish the IPK"
            exit 1
          }
          (cd dist-legacy && sha256sum "$ipk" > SHA256SUMS)
          python3 - "$version" "$ipk" <<'PY'
          import hashlib, json, os, pathlib, sys
          version, ipk = sys.argv[1:]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SOURCE_SHA"]
          digest = hashlib.sha256(pathlib.Path(f"dist-legacy/{ipk}").read_bytes()).hexdigest()
          manifest = {
              "id": "org.csweb.tv.legacy",
              "version": version,
              "type": "native",
              "title": "CloudStream Hub - INNO-Hit 55",
              "appDescription": "Experimental native webOS build for INNO-Hit IH55UWB (IH55UWB4 not tested). "
                                "Ships the pinned doGior plugins (StreamingCommunity and others) bundled for the "
                                "device owner's personal use; no other content is preinstalled.",
              "iconUri": f"https://raw.githubusercontent.com/{repo}/{sha}/apps/csweb-tv/packaging/icons/largeIcon.png",
              "sourceUrl": f"https://github.com/{repo}",
              "rootRequired": False,
              "ipkUrl": ipk,
              "ipkHash": {"sha256": digest},
          }
          pathlib.Path("dist-legacy/org.csweb.tv.legacy.manifest.json").write_text(
              json.dumps(manifest, indent=1) + "\n"
          )
          pathlib.Path("version.txt").write_text(version + "\n")
          print(json.dumps(manifest, indent=1))
          PY
          version=$(cat version.txt)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists; refusing to overwrite it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          sha=$(cut -d' ' -f1 dist-legacy/SHA256SUMS)
          cat > notes.md <<EOF
          CloudStream Hub $VERSION INNO-Hit package built and checked by CI from commit \`$SOURCE_SHA\` (run [#$RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID)).

          **IPK:** \`org.csweb.tv.legacy_${VERSION}_arm.ipk\`
          **SHA-256:** \`$sha\`

          This is an experimental native webOS build for IH55UWB; IH55UWB4 and device behavior are not verified by CI. CI tests are offline and do not establish provider search, network access, playback, or TV compatibility.

          This build bundles the pinned doGior plugins (StreamingCommunity, AnimeUnity, AnimeWorld) inside the IPK for the device owner's personal use, per the owner's decision. doGior does not declare a licence for these \`.cs3\` files, so they are not part of the public source tree or of ordinary public releases. This pre-release uses the IPK from the exact successful CI run linked above, not an older artifact.
          EOF

      - name: Create pre-release with the exact CI artifact
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "v$VERSION" --prerelease --latest=false \
            --target "$SOURCE_SHA" \
            --title "CloudStream Hub $VERSION (candidate)" \
            --notes-file notes.md \
            "dist-legacy/org.csweb.tv.legacy_${VERSION}_arm.ipk" \
            dist-legacy/org.csweb.tv.legacy.manifest.json dist-legacy/SHA256SUMS
